<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CmdCraft // AI Interview Prep</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap">
  <style>.ans p{margin:.5rem 0}.ans ul{list-style:disc;margin:.4rem 0 .4rem 1.25rem}.ans li{margin:.15rem 0}.ans strong{color:#34d399}[data-theme=light] .ans strong{color:#047857}</style>
</head>
<body class="bg-surface-0 text-neutral-200 font-sans min-h-screen">
  <header class="border-b border-neutral-800 bg-surface-1 px-4 py-3 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <a href="../" class="font-extrabold text-xl text-emerald-400">CmdCraft</a>
        <span class="text-neutral-500 text-sm truncate"><i class="fa-solid fa-brain mr-1"></i>AI interview prep</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <button id="btn-mock" class="px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-black font-semibold"><i class="fa-solid fa-user-tie mr-1"></i>Mock interview</button>
        <a href="../" class="hidden sm:inline text-neutral-400 hover:text-neutral-200"><i class="fa-solid fa-arrow-left mr-1"></i>Hub</a>
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-4 py-5 grid md:grid-cols-[270px_1fr] gap-6">
    <aside class="space-y-3 md:sticky md:top-20 md:self-start md:max-h-[calc(100vh-6rem)] md:overflow-y-auto pr-1">
      <input id="search" type="search" placeholder="Search all questions…" class="w-full px-3 py-2 rounded-lg bg-surface-1 border border-neutral-700 text-sm focus:outline-none focus:border-emerald-400">
      <div>
        <div class="text-[10px] uppercase tracking-wide text-neutral-500 mb-1">Difficulty</div>
        <div id="levels" class="flex flex-wrap gap-1"></div>
      </div>
      <div id="progress" class="text-xs text-neutral-400"></div>
      <div class="text-[10px] uppercase tracking-wide text-neutral-500">Study order: top to bottom</div>
      <nav id="modules" class="space-y-3"></nav>
    </aside>

    <main>
      <div id="study"></div>
      <div id="mock" class="hidden"></div>
    </main>
  </div>

  <script src="content/qa-rag.js"></script>
  <script src="content/qa-langchain.js"></script>
  <script src="content/qa-langgraph.js"></script>
  <script src="content/qa-agents.js"></script>
  <script src="content/qa-llm.js"></script>
  <script src="content/qa-prod.js"></script>
  <script src="content/qa-ml.js"></script>
  <script src="content/qa-extra.js"></script>
  <script src="content/hard-rag.js"></script>
  <script src="content/hard-llm.js"></script>
  <script src="content/hard-agents.js"></script>
  <script src="content/hard-prod.js"></script>
  <script src="content/pro-rag.js"></script>
  <script src="content/pro-frameworks.js"></script>
  <script src="content/pro-llm.js"></script>
  <script src="content/pro-prod.js"></script>
  <script src="content/pro-coding.js"></script>
  <script src="../shared/qa-viewer.js"></script>
  <script>
    QAViewer.init({
      bank: window.AI_INTERVIEW, hard: window.AI_HARD, pro: window.AI_PRO,
      key: "cmdcraft.ai.interview.v2", defaultLevel: "pro",
      levelFor: (m, t) => (/walkthrough$|^beh$/.test(t.id) ? "project" : (m.id === "serving" ? "hard" : "core")),
      sections: [
        { name: "Foundations", note: "How models learn and generate. Everything below assumes this.", mods: ["ml", "llm", "prompting"] },
        { name: "Retrieval and knowledge", note: "Giving models your data: embeddings, vector search, RAG.", mods: ["rag"] },
        { name: "Frameworks", note: "LangChain and LangGraph: composing and orchestrating.", mods: ["langchain", "langgraph"] },
        { name: "Agents", note: "Tool use, MCP, multi-agent systems, security.", mods: ["agents"] },
        { name: "Customising models", note: "Fine-tuning, LoRA, preference optimisation.", mods: ["finetuning"] },
        { name: "Production", note: "Evaluation, cost, latency, serving and system design.", mods: ["llmops", "serving", "design"] },
        { name: "Interview round", note: "Live coding, project deep-dives, responsible AI and behavioural questions.", mods: ["coding", "responsible"] }
      ],
      levels: [
        { id: "pro", label: "Experienced (2+ yrs)", test: lv => lv === "pro" || lv === "hard" || lv === "tricky" },
        { id: "code", label: "Live coding", test: lv => lv === "code" },
        { id: "project", label: "Project walkthroughs", test: lv => lv === "project" },
        { id: "core", label: "Fundamentals", test: lv => lv === "core" },
        { id: "all", label: "Everything", test: () => true }
      ]
    });
    </script>
  <script src="../shared/pwa.js"></script>
</body>
</html>
