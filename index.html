<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CmdCraft // Practice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="shared/theme.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap">
</head>
<body class="bg-surface-0 text-neutral-200 font-sans min-h-screen">
  <header class="border-b border-neutral-800 bg-surface-1 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <span class="font-extrabold text-xl text-emerald-400">CmdCraft</span>
      <a href="activity.html" class="text-xs text-neutral-400 hover:text-neutral-200"><i class="fa-solid fa-chart-line mr-1"></i>Activity</a>
    </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">
    <div>
      <h1 class="text-xl font-bold text-neutral-100">Choose a subject</h1>
      <p class="text-sm text-neutral-400 mt-1">Hands-on practice that checks what you actually did, not just what you typed.</p>
    </div>
    <div id="subjects" class="grid sm:grid-cols-2 gap-4"></div>
  </main>
  <script>
    // Add a subject here when its folder exists (see README: "Adding a subject").
    const SUBJECTS = [
      { name: "Linux", href: "linux/", icon: "fa-terminal", live: true, blurb: "29 modules from the shell to production incidents, Vim, Bash scripting and interview prep." },
      { name: "SQL", icon: "fa-database", blurb: "Coming soon" },
      { name: "Python", icon: "fa-brands fa-python", blurb: "Coming soon" },
      { name: "React", icon: "fa-brands fa-react", blurb: "Coming soon" },
      { name: "AI", icon: "fa-robot", blurb: "Coming soon" }
    ];
    const box = document.getElementById("subjects");
    SUBJECTS.forEach(s => {
      const a = document.createElement(s.live ? "a" : "div");
      if (s.live) a.href = s.href;
      a.className = "rounded-xl border p-5 flex gap-4 items-start " + (s.live ? "border-emerald-500/40 bg-surface-1 hover:border-emerald-400 transition" : "border-neutral-800 opacity-60");
      const i = document.createElement("i"); i.className = (/ /.test(s.icon) ? s.icon : "fa-solid " + s.icon) + " text-2xl text-emerald-400 mt-0.5"; a.appendChild(i);
      const t = document.createElement("div");
      const h = document.createElement("div"); h.className = "font-semibold text-neutral-100"; h.textContent = s.name; t.appendChild(h);
      const p = document.createElement("div"); p.className = "text-sm text-neutral-400 mt-0.5"; p.textContent = s.blurb; t.appendChild(p);
      a.appendChild(t); box.appendChild(a);
    });
  </script>
</body>
</html>
