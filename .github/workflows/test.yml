name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run all test suites
        run: npm test
      - name: The offline asset list must be up to date
        run: |
          npm run build:assets
          git diff --exit-code sw-assets.json
